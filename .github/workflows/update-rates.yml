name: Update Rates Data

on:
  schedule:
    # Run at 22:00 UTC (6:00 PM ET) Monday through Friday
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.2.1'

      - name: Fetch Latest Rates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || '2d9fe8dbad89dabfd5afba8ca6e5f4f6' }}
        run: |
          node scripts/fetch-fed-rates.mjs
          node scripts/fetch-fx-rates.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update static rates data [skip ci]"
            git push
          fi
