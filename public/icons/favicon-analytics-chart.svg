<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Area under curve -->
  <path d="M12 48 L12 40 L23 34 L33 38 L44 22 L52 16 L52 48 Z" fill="url(#chartGrad)"/>
  <!-- Chart Line -->
  <path d="M12 40 L23 34 L33 38 L44 22 L52 16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <path d="M43 16 H52 V25" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend Bars -->
  <rect x="14" y="44" width="5" height="5" rx="1" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="23" y="38" width="5" height="11" rx="1" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="32" y="41" width="5" height="8" rx="1" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="41" y="27" width="5" height="22" rx="1" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
