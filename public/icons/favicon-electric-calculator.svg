<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="35%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="calcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00B4D8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bodyGrad)" filter="url(#calcGlow)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Calculator Screen -->
  <rect x="11" y="11" width="42" height="13" rx="3.5" fill="url(#screenGrad)"/>
  <!-- Digits / Display readout -->
  <rect x="33" y="15" width="16" height="5" rx="1.5" fill="#0F172A"/>
  <rect x="24" y="15" width="6" height="5" rx="1.5" fill="#0284C7"/>

  <!-- Keypad Row 1 -->
  <rect x="11" y="28" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="22" y="28" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="33" y="28" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="44" y="28" width="9" height="8" rx="2.5" fill="#F59E0B"/>

  <!-- Keypad Row 2 -->
  <rect x="11" y="38" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="22" y="38" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="33" y="38" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="44" y="38" width="9" height="8" rx="2.5" fill="#10B981"/>

  <!-- Keypad Row 3 -->
  <rect x="11" y="48" width="20" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="33" y="48" width="9" height="8" rx="2.5" fill="#FFFFFF"/>
  <rect x="44" y="48" width="9" height="8" rx="2.5" fill="#EF4444"/>
</svg>
