<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Dark Navy Base Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" filter="url(#matrixGlow)"/>

  <!-- Top Left: Plus (+) in Coral Red -->
  <rect x="8" y="8" width="22" height="22" rx="6" fill="#EF4444"/>
  <path d="M19 13v12M13 19h12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Right: Minus (-) in Electric Sky Blue -->
  <rect x="34" y="8" width="22" height="22" rx="6" fill="#0EA5E9"/>
  <path d="M39 19h12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Left: Multiply (×) in Vibrant Emerald -->
  <rect x="8" y="34" width="22" height="22" rx="6" fill="#10B981"/>
  <path d="M14.5 39.5l9 9M23.5 39.5l-9 9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Right: Equals (=) in Bright Gold / Amber -->
  <rect x="34" y="34" width="22" height="22" rx="6" fill="#F59E0B"/>
  <path d="M39 42.5h12M39 47.5h12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
